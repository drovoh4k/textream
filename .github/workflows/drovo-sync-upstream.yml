name: Sync with upstream

# Merges f/textream into this fork's master once a day. If the merge is clean it pushes and
# chains straight into the build workflow (a push made with GITHUB_TOKEN does not trigger
# other workflows by itself). Conflicts leave master untouched and appear in the run summary,
# with an issue as well when the repository has issues enabled.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: drovo-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/f/textream.git
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Sin novedades en upstream."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_SHA="$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")"
          echo "Mergeando upstream/$UPSTREAM_BRANCH ($UPSTREAM_SHA)…"

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push origin master
            {
              echo "merged=true"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            MERGE_STATUS=$?
          fi

          CONFLICTS="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
          if [ -z "$CONFLICTS" ]; then
            echo "::error::El merge ha fallado sin conflictos; revisa el error de Git."
            exit "$MERGE_STATUS"
          fi
          git merge --abort
          echo "merged=false" >> "$GITHUB_OUTPUT"
          MARKER="<!-- upstream-conflict:$(git rev-parse "upstream/$UPSTREAM_BRANCH") -->"

          {
            echo "$MARKER"
            echo "El merge automático de \`f/textream@$UPSTREAM_SHA\` ha dado conflictos, así que"
            echo "\`master\` se ha quedado como estaba y no se ha publicado ninguna build nueva."
            echo
            echo "**Archivos en conflicto**"
            echo
            echo "$CONFLICTS"
            echo
            echo "Para resolverlo en local:"
            echo
            echo '```bash'
            echo "git fetch upstream $UPSTREAM_BRANCH"
            echo "git merge upstream/$UPSTREAM_BRANCH"
            echo "# resuelve, git add …, git commit"
            echo "git push origin master"
            echo '```'
            echo
            echo "_Workflow: [$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)_"
          } > conflict.md
          cat conflict.md >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Upstream necesita resolver conflictos a mano. Master sigue intacto; consulta el resumen."

          ISSUES_ENABLED="$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq '.hasIssuesEnabled')"
          if [ "$ISSUES_ENABLED" = "false" ]; then
            echo "Issues desactivadas en este repositorio; el conflicto queda registrado en este resumen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          EXISTING="$(gh issue list --label upstream-conflict --state open --limit 1 --json number --jq '.[0].number // empty')"
          TITLE="Conflicto al mergear upstream ($UPSTREAM_SHA)"
          if [ -n "$EXISTING" ]; then
            BODY="$(gh issue view "$EXISTING" --json body --jq '.body')"
            if [[ "$BODY" != *"$MARKER"* ]]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file conflict.md
            fi
          else
            gh label create upstream-conflict --force \
              --color B60205 \
              --description "El merge automático del upstream necesita resolverse a mano"
            gh issue create \
              --title "$TITLE" \
              --label upstream-conflict \
              --body-file conflict.md
          fi

          exit 0

  build:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/drovo-build.yml
    with:
      # Without this the called workflow would check out master as it was before the merge.
      ref: ${{ needs.sync.outputs.sha }}
